name: Release

# Push a tag like v1.2.0 to build a signed release and publish it on GitHub.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  android-release:
    name: Android · signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PATH: release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Build signed APK and AAB
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}" \
            -PapiBaseUrl="${{ vars.API_BASE_URL || 'https://dev.trackademy.kz/' }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
